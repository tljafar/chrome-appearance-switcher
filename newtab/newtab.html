<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div class="newtab-container" id="newtabApp">
    <!-- Top Bar Controls -->
    <div class="top-bar">
      <div class="extension-tag">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
        </svg>
        <span>Chrome Appearance Switcher</span>
      </div>

      <div class="theme-quick-pill" id="themeQuickToggle">
        <span class="pill-icon" id="pillIcon">☀️</span>
        <span class="pill-text" id="pillText">Light Mode</span>
      </div>
    </div>

    <!-- Center Content -->
    <main class="center-stage">
      <div class="clock-widget">
        <div class="time-display" id="timeDisplay">12:00</div>
        <div class="date-display" id="dateDisplay">Monday, January 1</div>
        <div class="greeting-display" id="greetingDisplay">Good day</div>
      </div>

      <!-- Omnibox Search Bar -->
      <form class="search-form" id="searchForm" action="https://www.google.com/search" method="GET">
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" name="q" class="search-input" id="searchInput" placeholder="Search Google or type a URL" autofocus autocomplete="off">
        </div>
      </form>

      <!-- Quick Shortcuts -->
      <div class="shortcuts-grid">
        <a href="https://www.google.com" class="shortcut-item">
          <div class="shortcut-icon google">G</div>
          <span class="shortcut-label">Google</span>
        </a>
        <a href="https://github.com" class="shortcut-item">
          <div class="shortcut-icon github">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
            </svg>
          </div>
          <span class="shortcut-label">GitHub</span>
        </a>
        <a href="https://youtube.com" class="shortcut-item">
          <div class="shortcut-icon youtube">▶</div>
          <span class="shortcut-label">YouTube</span>
        </a>
        <a href="chrome://settings/appearance" class="shortcut-item" id="shortcutAppearance">
          <div class="shortcut-icon appearance">🎨</div>
          <span class="shortcut-label">Appearance</span>
        </a>
      </div>
    </main>

    <!-- Bottom Status -->
    <footer class="bottom-bar">
      <span class="footer-tip">Tip: Press <kbd style="padding:2px 6px; border-radius:4px; border:1px solid currentColor; font-family:inherit; font-weight:600; font-size:11px;">Alt+Shift+D</kbd> anywhere to toggle browser appearance</span>
    </footer>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
